<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout((${form.novo} ? 'Novo tipo de perícia' : 'Editar tipo de perícia'), ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="barra-voltar">
        <a th:replace="~{fragmentos/pagina :: voltar(@{/tipos-pericia})}"></a>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/tipos-pericia}">Tipos de perícia</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${form.novo} ? 'Novo tipo de perícia' : 'Editar tipo de perícia'">Tipo de perícia</li>
            </ol>
        </nav>
    </div>

    <div class="cabecalho-pagina">
        <h1 class="titulo-pagina">
            <span class="icone-titulo"><i class="bi" th:classappend="${form.novo} ? 'bi-plus-lg' : 'bi-pencil'"></i></span>
            <span th:text="${form.novo} ? 'Novo tipo de perícia' : 'Editar tipo de perícia'">Tipo de perícia</span>
        </h1>
    </div>

    <form th:object="${form}" method="post" novalidate
          th:action="${form.novo} ? @{/tipos-pericia} : @{/tipos-pericia/{id}(id=${form.id})}">

        <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="mensagem : ${#fields.globalErrors()}" th:text="${mensagem}">Erro</p>
        </div>

        <div class="card mb-3">
            <div class="card-body row g-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome do tipo de perícia</label>
                    <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"
                           maxlength="100" required>
                    <div class="invalid-feedback" th:errors="*{nome}">Erro</div>
                    <div class="form-text">
                        Ex.: Perícia Médica Inicial, Avaliação Médica Pericial BPC. Renomear vale também para as
                        perícias já cadastradas; para deixar de usar um tipo, desative-o em vez de renomear.
                    </div>
                </div>
                <div class="col-12">
                    <label for="descricao" class="form-label">Descrição <span class="text-body-secondary">(opcional)</span></label>
                    <textarea class="form-control" th:field="*{descricao}" th:errorclass="is-invalid"
                              rows="3" maxlength="500"></textarea>
                    <div class="invalid-feedback" th:errors="*{descricao}">Erro</div>
                </div>
            </div>
        </div>

        <div class="barra-acoes-form">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
            <a th:href="@{/tipos-pericia}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
