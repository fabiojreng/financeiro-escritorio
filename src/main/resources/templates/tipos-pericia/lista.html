<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Tipos de perícia', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="cabecalho-pagina">
        <div>
            <h1 class="titulo-pagina"><span class="icone-titulo"><i class="bi bi-clipboard2-pulse"></i></span> Tipos de perícia</h1>
            <p class="subtitulo-pagina">
                Tipos escolhidos ao anotar uma perícia médica.
                Um tipo desativado deixa de aparecer em novas perícias, mas continua nas antigas.
            </p>
        </div>
        <div class="acoes-pagina">
            <a th:href="@{/tipos-pericia/novo}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Novo tipo de perícia
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>Descrição</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(tipos)}">
                    <td colspan="4" class="estado-vazio">
                        <i class="bi bi-clipboard2-pulse"></i>
                        Nenhum tipo de perícia cadastrado.
                    </td>
                </tr>
                <tr th:each="tipo : ${tipos}">
                    <td class="fw-semibold" th:text="${tipo.nome}">Perícia Médica Inicial</td>
                    <td class="text-body-secondary" th:text="${tipo.descricao} ?: '—'">—</td>
                    <td>
                        <span th:if="${tipo.ativo}" class="badge selo-sucesso">Ativo</span>
                        <span th:unless="${tipo.ativo}" class="badge selo-neutro">Inativo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/tipos-pericia/{id}/editar(id=${tipo.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <form th:if="${tipo.ativo}" th:action="@{/tipos-pericia/{id}/desativar(id=${tipo.id})}"
                              method="post" class="d-inline"
                              th:attr="data-confirmar='Desativar o tipo de perícia ' + ${tipo.nome} + '? Ele não aparecerá em novas perícias.'">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-slash-circle"></i> Desativar
                            </button>
                        </form>
                        <form th:unless="${tipo.ativo}" th:action="@{/tipos-pericia/{id}/ativar(id=${tipo.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                <i class="bi bi-check-circle"></i> Ativar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
