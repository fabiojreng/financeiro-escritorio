<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Usuários', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="cabecalho-pagina">
        <div>
            <h1 class="titulo-pagina"><span class="icone-titulo"><i class="bi bi-people"></i></span> Usuários</h1>
            <p class="subtitulo-pagina">
                Pessoas que podem entrar no sistema. Usuários desativados não conseguem fazer login,
                mas o histórico de operações deles é mantido.
            </p>
        </div>
        <div class="acoes-pagina">
            <a th:href="@{/usuarios/novo}" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> Novo usuário
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>Login</th>
                    <th>Perfil</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="5" class="estado-vazio">
                        <i class="bi bi-people"></i>
                        Nenhum usuário cadastrado.
                    </td>
                </tr>
                <tr th:each="usuario : ${usuarios}">
                    <td class="fw-semibold" th:text="${usuario.nome}">Maria</td>
                    <td th:text="${usuario.username}">maria</td>
                    <td>
                        <span class="badge" th:classappend="${usuario.perfil.sistema} ? 'text-bg-danger' : 'text-bg-light border'"
                              th:text="${usuario.perfil.nome}">Operador</span>
                    </td>
                    <td>
                        <span th:if="${usuario.ativo}" class="badge selo-sucesso">Ativo</span>
                        <span th:unless="${usuario.ativo}" class="badge selo-neutro">Inativo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <form th:if="${usuario.ativo}" th:action="@{/usuarios/{id}/desativar(id=${usuario.id})}"
                              method="post" class="d-inline"
                              th:attr="data-confirmar='Desativar o usuário ' + ${usuario.nome} + '? Ele não conseguirá mais entrar no sistema.'">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-person-x"></i> Desativar
                            </button>
                        </form>
                        <form th:unless="${usuario.ativo}" th:action="@{/usuarios/{id}/ativar(id=${usuario.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                <i class="bi bi-person-check"></i> Ativar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
