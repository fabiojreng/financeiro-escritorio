<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Gerar parcelas', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/honorarios}">Honorários</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/honorarios/{id}(id=${resumo.acordo.id})}" th:text="${resumo.acordo.atendimento.cliente.nome}">Maria</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Gerar parcelas</li>
        </ol>
    </nav>

    <h1 class="h3 mb-3">Gerar parcelas</h1>

    <p class="text-body-secondary">
        O valor total é dividido em parcelas iguais, com vencimentos mensais a partir da primeira data.
        A diferença de centavos fica na última parcela. Depois de geradas, cada parcela pode ser ajustada.
    </p>

    <form th:object="${form}" th:action="@{/honorarios/{id}/parcelas/gerar(id=${resumo.acordo.id})}" method="post" novalidate>
        <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="mensagem : ${#fields.globalErrors()}" th:text="${mensagem}">Erro</p>
        </div>

        <div class="card mb-3">
            <div class="card-body row g-3">
                <div class="col-md-4">
                    <label for="valorTotal" class="form-label">Valor total a parcelar</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text">R$</span>
                        <input type="text" inputmode="decimal" class="form-control" th:field="*{valorTotal}"
                               th:errorclass="is-invalid" placeholder="0,00" required>
                        <div class="invalid-feedback" th:errors="*{valorTotal}">Erro</div>
                    </div>
                    <div class="form-text" th:if="${resumo.saldo != null}"
                         th:text="'Saldo pendente atual: ' + ${#numbers.formatCurrency(resumo.saldo)}">Saldo</div>
                </div>
                <div class="col-md-4">
                    <label for="quantidade" class="form-label">Quantidade de parcelas</label>
                    <input type="number" min="1" max="120" class="form-control" th:field="*{quantidade}"
                           th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{quantidade}">Erro</div>
                </div>
                <div class="col-md-4">
                    <label for="primeiroVencimento" class="form-label">Vencimento da primeira parcela</label>
                    <input type="date" class="form-control" th:field="*{primeiroVencimento}" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{primeiroVencimento}">Erro</div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-list-ol"></i> Gerar parcelas</button>
            <a th:href="@{/honorarios/{id}(id=${resumo.acordo.id})}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
