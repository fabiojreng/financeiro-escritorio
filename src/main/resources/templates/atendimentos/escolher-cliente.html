<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Novo atendimento', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <h1 class="h3 mb-1">Novo atendimento</h1>
    <p class="text-body-secondary">Primeiro, escolha o cliente.</p>

    <form method="get" th:action="@{/atendimentos/novo}" class="row g-2 align-items-end mb-3">
        <div class="col-md-6">
            <label for="busca" class="form-label">Pesquisar cliente</label>
            <input type="search" id="busca" name="busca" class="form-control" th:value="${busca}"
                   placeholder="Nome ou CPF do cliente" autofocus>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i> Pesquisar</button>
        </div>
    </form>

    <div class="card mb-3">
        <ul class="list-group list-group-flush">
            <li class="list-group-item text-body-secondary" th:if="${clientes.empty}">
                Nenhum cliente ativo encontrado.
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center gap-2" th:each="c : ${clientes}">
                <div>
                    <div th:text="${c.nome}">Maria</div>
                    <div class="small text-body-secondary" th:text="${c.cpfFormatado} ?: 'CPF não informado'">CPF</div>
                </div>
                <a th:href="@{/atendimentos/novo(clienteId=${c.id})}" class="btn btn-sm btn-primary">Selecionar</a>
            </li>
        </ul>
    </div>

    <p class="text-body-secondary small" th:if="${clientes.totalElements > clientes.size}">
        Mostrando os primeiros resultados. Refine a pesquisa para encontrar o cliente.
    </p>

    <p>
        O cliente ainda não tem cadastro?
        <a th:href="@{/clientes/novo}">Cadastrar novo cliente</a>
    </p>
</section>
</body>
</html>
