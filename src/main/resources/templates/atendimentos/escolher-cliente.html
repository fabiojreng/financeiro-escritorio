<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Novo atendimento', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="barra-voltar">
        <a th:replace="~{fragmentos/pagina :: voltar(@{/atendimentos})}"></a>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/atendimentos}">Atendimentos</a></li>
                <li class="breadcrumb-item active" aria-current="page">Novo atendimento</li>
            </ol>
        </nav>
    </div>

    <div class="cabecalho-pagina">
        <div>
            <h1 class="titulo-pagina"><span class="icone-titulo"><i class="bi bi-folder-plus"></i></span> Novo atendimento</h1>
            <p class="subtitulo-pagina">Primeiro, escolha o cliente.</p>
        </div>
    </div>

    <form method="get" th:action="@{/atendimentos/novo}" class="card card-body filtros mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-6">
                <label for="busca" class="form-label">Pesquisar cliente</label>
                <input type="search" id="busca" name="busca" class="form-control" th:value="${busca}"
                       placeholder="Nome ou CPF do cliente" autofocus>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Pesquisar</button>
            </div>
        </div>
    </form>

    <div class="card mb-3">
        <ul class="list-group list-group-flush">
            <li class="list-group-item estado-vazio" th:if="${clientes.empty}">
                <i class="bi bi-person-vcard"></i>
                Nenhum cliente ativo encontrado.
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center gap-2" th:each="c : ${clientes}">
                <div>
                    <div class="fw-semibold" th:text="${c.nome}">Maria</div>
                    <div class="small text-body-secondary" th:text="${c.cpfFormatado} ?: 'CPF não informado'">CPF</div>
                </div>
                <a th:href="@{/atendimentos/novo(clienteId=${c.id})}" class="btn btn-sm btn-primary">
                    Selecionar <i class="bi bi-chevron-right"></i>
                </a>
            </li>
        </ul>
    </div>

    <p class="text-body-secondary small" th:if="${clientes.totalElements > clientes.size}">
        Mostrando os primeiros resultados. Refine a pesquisa para encontrar o cliente.
    </p>

    <p>
        O cliente ainda não tem cadastro?
        <a th:href="@{/clientes/novo}">Cadastrar novo cliente</a>
    </p>
</section>
</body>
</html>
