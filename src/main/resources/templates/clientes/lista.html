<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Clientes', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Clientes</h1>
        <a th:href="@{/clientes/novo}" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Novo cliente
        </a>
    </div>

    <form method="get" th:action="@{/clientes}" class="row g-2 align-items-end mb-3">
        <div class="col-md-6">
            <label for="busca" class="form-label">Pesquisar</label>
            <input type="search" id="busca" name="busca" class="form-control" th:value="${busca}"
                   placeholder="Nome ou CPF do cliente" autofocus>
        </div>
        <div class="col-sm-6 col-md-3">
            <label for="situacao" class="form-label">Situação</label>
            <select id="situacao" name="situacao" class="form-select">
                <option th:each="s : ${situacoes}" th:value="${s}" th:text="${s.rotulo}"
                        th:selected="${s == situacao}">Ativos</option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary"><i class="bi bi-search"></i> Pesquisar</button>
        </div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Cadastro</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${clientes.empty}">
                    <td colspan="6" class="text-center text-body-secondary py-4">
                        Nenhum cliente encontrado.
                        <a th:href="@{/clientes/novo}">Cadastrar novo cliente</a>
                    </td>
                </tr>
                <tr th:each="cliente : ${clientes}">
                    <td><a th:href="@{/clientes/{id}(id=${cliente.id})}" th:text="${cliente.nome}">Maria</a></td>
                    <td class="text-nowrap" th:text="${cliente.cpfFormatado} ?: '—'">000.000.000-00</td>
                    <td class="text-nowrap" th:text="${cliente.telefone} ?: '—'">—</td>
                    <td th:text="${#temporals.format(cliente.dataCadastro, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td>
                        <span th:if="${cliente.ativo}" class="badge text-bg-success">Ativo</span>
                        <span th:unless="${cliente.ativo}" class="badge text-bg-secondary">Inativo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/clientes/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye"></i> Ver
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav class="mt-3 d-flex flex-wrap align-items-center gap-3" th:if="${clientes.totalElements > 0}" aria-label="Paginação">
        <span class="text-body-secondary small"
              th:text="${clientes.totalElements} + (${clientes.totalElements == 1} ? ' cliente encontrado' : ' clientes encontrados')">
            3 clientes encontrados
        </span>
        <ul class="pagination mb-0" th:if="${clientes.totalPages > 1}">
            <li class="page-item" th:classappend="${clientes.first} ? 'disabled'">
                <a class="page-link" th:href="@{/clientes(busca=${busca}, situacao=${situacao}, pagina=${clientes.number - 1})}">Anterior</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Página ' + ${clientes.number + 1} + ' de ' + ${clientes.totalPages}">Página 1 de 2</span>
            </li>
            <li class="page-item" th:classappend="${clientes.last} ? 'disabled'">
                <a class="page-link" th:href="@{/clientes(busca=${busca}, situacao=${situacao}, pagina=${clientes.number + 1})}">Próxima</a>
            </li>
        </ul>
    </nav>
</section>
</body>
</html>
