<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Clientes', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="cabecalho-pagina">
        <div>
            <h1 class="titulo-pagina"><span class="icone-titulo"><i class="bi bi-person-vcard"></i></span> Clientes</h1>
            <p class="subtitulo-pagina">Pesquise por nome ou CPF e abra o cliente para ver pagamentos e histórico financeiro.</p>
        </div>
        <div class="acoes-pagina" sec:authorize="hasAuthority('CLIENTES_EDITAR')">
            <a th:href="@{/clientes/novo}" class="btn btn-primary">
                <i class="bi bi-person-plus"></i> Novo cliente
            </a>
        </div>
    </div>

    <form method="get" th:action="@{/clientes}" class="card card-body filtros mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-md-6 col-lg-4 position-relative">
                <label for="busca" class="form-label">Pesquisar</label>
                <input type="search" id="busca" name="busca" class="form-control" th:value="${busca}"
                       placeholder="Nome ou CPF do cliente" autofocus autocomplete="off"
                       role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="sugestoes-busca"
                       data-sugerir-cliente data-ao-escolher="abrir"
                       th:attr="data-url-sugestoes=@{/clientes/sugestoes(todos=true)},data-url-ficha=@{/clientes/}">
                <div class="list-group shadow sugestoes-cliente" id="sugestoes-busca" role="listbox"
                     aria-label="Clientes cadastrados" hidden></div>
            </div>
            <div class="col-sm-6 col-md-3">
                <label for="observacao" class="form-label">Observação</label>
                <input type="search" id="observacao" name="observacao" class="form-control" th:value="${observacao}"
                       placeholder="Parte do texto das observações">
            </div>
            <div class="col-sm-6 col-md-3">
                <label for="situacao" class="form-label">Situação</label>
                <select id="situacao" name="situacao" class="form-select" data-padrao="ATIVOS">
                    <option th:each="s : ${situacoes}" th:value="${s}" th:text="${s.rotulo}"
                            th:selected="${s == situacao}">Ativos</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Pesquisar</button>
                <a th:href="@{/clientes}" class="btn btn-link">Limpar</a>
            </div>
        </div>
        <div class="etiquetas-filtro" data-etiquetas-filtro hidden></div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Cadastro</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${clientes.empty}">
                    <td colspan="6" class="estado-vazio">
                        <i class="bi bi-person-vcard"></i>
                        Nenhum cliente encontrado.
                        <a th:href="@{/clientes/novo}" sec:authorize="hasAuthority('CLIENTES_EDITAR')">Cadastrar novo cliente</a>
                    </td>
                </tr>
                <tr th:each="cliente : ${clientes}" class="linha-clicavel" th:attr="data-link=@{/clientes/{id}(id=${cliente.id})}">
                    <td>
                        <a class="fw-semibold" th:href="@{/clientes/{id}(id=${cliente.id})}" th:text="${cliente.nome}">Maria</a>
                        <div th:replace="~{fragmentos/observacao :: trecho(${cliente.observacoes}, ${observacao})}"></div>
                    </td>
                    <td class="text-nowrap" th:text="${cliente.cpfFormatado} ?: '—'">000.000.000-00</td>
                    <td class="text-nowrap" th:text="${cliente.telefone} ?: '—'">—</td>
                    <td th:text="${#temporals.format(cliente.dataCadastro, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td>
                        <span th:if="${cliente.ativo}" class="badge selo-sucesso">Ativo</span>
                        <span th:unless="${cliente.ativo}" class="badge selo-neutro">Inativo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/clientes/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-eye"></i> Ver
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragmentos/pagina :: paginacao(${clientes}, 'cliente encontrado', 'clientes encontrados')}"></nav>
</section>
</body>
</html>
