<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout((${form.novo} ? 'Novo cliente' : 'Editar cliente'), ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <h1 class="h3 mb-3" th:text="${form.novo} ? 'Novo cliente' : 'Editar cliente'">Cliente</h1>

    <form th:object="${form}" method="post" novalidate
          th:action="${form.novo} ? @{/clientes} : @{/clientes/{id}(id=${form.id})}">

        <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="mensagem : ${#fields.globalErrors()}" th:text="${mensagem}">Erro</p>
        </div>

        <div class="alert alert-warning" role="alert" th:if="${clienteExistenteId != null}">
            <i class="bi bi-exclamation-triangle"></i>
            Este CPF já pertence a
            <a th:href="@{/clientes/{id}(id=${clienteExistenteId})}" th:text="${clienteExistenteNome}"
               class="alert-link" target="_blank">cliente</a>.
            Confira se não é a mesma pessoa antes de continuar.
        </div>

        <div class="card mb-3">
            <div class="card-header">Identificação</div>
            <div class="card-body row g-3">
                <div class="col-md-8">
                    <label for="nome" class="form-label">Nome completo</label>
                    <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"
                           maxlength="150" required>
                    <div class="invalid-feedback" th:errors="*{nome}">Erro</div>
                </div>
                <div class="col-md-4">
                    <label for="cpf" class="form-label">CPF <span class="text-body-secondary">(opcional)</span></label>
                    <input type="text" class="form-control" th:field="*{cpf}" th:errorclass="is-invalid"
                           maxlength="20" inputmode="numeric" placeholder="000.000.000-00">
                    <div class="invalid-feedback" th:errors="*{cpf}">Erro</div>
                </div>
                <div class="col-md-4">
                    <label for="telefone" class="form-label">Telefone ou contato <span class="text-body-secondary">(opcional)</span></label>
                    <input type="text" class="form-control" th:field="*{telefone}" th:errorclass="is-invalid"
                           maxlength="30" inputmode="tel" placeholder="(00) 00000-0000">
                    <div class="invalid-feedback" th:errors="*{telefone}">Erro</div>
                </div>
                <div class="col-md-4">
                    <label for="dataCadastro" class="form-label">Data de cadastro</label>
                    <input type="date" class="form-control" th:field="*{dataCadastro}" th:errorclass="is-invalid" required>
                    <div class="invalid-feedback" th:errors="*{dataCadastro}">Erro</div>
                </div>
            </div>
        </div>

        <div class="card mb-3">
            <div class="card-header">Observações administrativas</div>
            <div class="card-body">
                <textarea class="form-control" th:field="*{observacoes}" th:errorclass="is-invalid"
                          rows="4" maxlength="2000"
                          aria-label="Observações administrativas"></textarea>
                <div class="invalid-feedback" th:errors="*{observacoes}">Erro</div>
                <div class="form-text">Não registre aqui documentos pessoais ou informações médicas.</div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
            <a th:href="${form.novo} ? @{/clientes} : @{/clientes/{id}(id=${form.id})}"
               class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
