<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
    Observações do registro nas listas, quando houver. Textos longos são encurtados; o texto inteiro fica
    na dica do mouse.
-->
<div th:fragment="texto(observacoes)" class="small text-body-secondary"
     th:if="${!#strings.isEmpty(observacoes)}" th:title="${observacoes}">
    <i class="bi bi-chat-left-text"></i> <span th:text="${#strings.abbreviate(observacoes, 160)}">Cliente pediu para ligar antes.</span>
</div>

<!-- Como texto, mas só quando o filtro de observação está preenchido, para mostrar por que a linha apareceu. -->
<th:block th:fragment="trecho(observacoes, filtro)" th:if="${!#strings.isEmpty(filtro)}">
    <div th:replace="~{fragmentos/observacao :: texto(${observacoes})}"></div>
</th:block>

</body>
</html>
