<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout((${form.novo} ? 'Novo tipo de serviço' : 'Editar tipo de serviço'), ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <h1 class="h3 mb-3" th:text="${form.novo} ? 'Novo tipo de serviço' : 'Editar tipo de serviço'">Tipo de serviço</h1>

    <form th:object="${form}" method="post" novalidate
          th:action="${form.novo} ? @{/tipos-servico} : @{/tipos-servico/{id}(id=${form.id})}">

        <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="mensagem : ${#fields.globalErrors()}" th:text="${mensagem}">Erro</p>
        </div>

        <div class="card mb-3">
            <div class="card-body row g-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome do serviço</label>
                    <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"
                           maxlength="100" required>
                    <div class="invalid-feedback" th:errors="*{nome}">Erro</div>
                    <div class="form-text">
                        Ex.: Auxílio-doença, BPC/LOAS, Pensão por morte. Renomear vale também para os pagamentos já
                        cadastrados; para deixar de usar um tipo, desative-o em vez de renomear.
                    </div>
                </div>
                <div class="col-12">
                    <label for="descricao" class="form-label">Descrição <span class="text-body-secondary">(opcional)</span></label>
                    <textarea class="form-control" th:field="*{descricao}" th:errorclass="is-invalid"
                              rows="3" maxlength="500"></textarea>
                    <div class="invalid-feedback" th:errors="*{descricao}">Erro</div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
            <a th:href="@{/tipos-servico}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
