<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Histórico de operações', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="cabecalho-pagina">
        <div>
            <h1 class="titulo-pagina"><span class="icone-titulo"><i class="bi bi-clock-history"></i></span> Histórico de operações</h1>
            <p class="subtitulo-pagina">
                Registro de quem fez cada alteração relevante e quando. Os registros não podem ser editados nem apagados.
            </p>
        </div>
    </div>

    <form method="get" th:action="@{/auditoria}" class="card card-body filtros mb-3">
        <div class="row g-2 align-items-end">
            <div class="col-sm-6 col-md-4">
                <label for="entidade" class="form-label">Tipo de registro</label>
                <select id="entidade" name="entidade" class="form-select">
                    <option value="">Todos</option>
                    <option th:each="e : ${entidades}" th:value="${e}" th:text="${e}"
                            th:selected="${e == entidade}">Usuário</option>
                </select>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary"><i class="bi bi-funnel"></i> Filtrar</button>
                <a th:href="@{/auditoria}" class="btn btn-link">Limpar</a>
            </div>
        </div>
        <div class="etiquetas-filtro" data-etiquetas-filtro hidden></div>
    </form>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Data e hora</th>
                    <th>Usuário</th>
                    <th>Operação</th>
                    <th>Registro</th>
                    <th>Descrição</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${registros.empty}">
                    <td colspan="5" class="estado-vazio">
                        <i class="bi bi-clock-history"></i>
                        Nenhuma operação registrada.
                    </td>
                </tr>
                <tr th:each="r : ${registros}">
                    <td class="text-nowrap" th:text="${#temporals.format(r.dataHora, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                    <td th:text="${r.usuario}">admin</td>
                    <td><span class="badge text-bg-light border" th:text="${r.acao.rotulo}">Cadastro</span></td>
                    <td class="text-nowrap" th:text="${r.entidade} + (${r.entidadeId} != null ? ' nº ' + ${r.entidadeId} : '')">Usuário nº 1</td>
                    <td th:text="${r.descricao}">Descrição</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <nav th:replace="~{fragmentos/pagina :: paginacao(${registros}, 'operação registrada', 'operações registradas')}"></nav>
</section>
</body>
</html>
