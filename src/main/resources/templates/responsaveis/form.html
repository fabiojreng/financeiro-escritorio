<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout((${form.novo} ? 'Novo responsável' : 'Editar responsável'), ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <h1 class="h3 mb-3" th:text="${form.novo} ? 'Novo responsável' : 'Editar responsável'">Responsável</h1>

    <form th:object="${form}" method="post" novalidate
          th:action="${form.novo} ? @{/responsaveis} : @{/responsaveis/{id}(id=${form.id})}">

        <div class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
            <p class="mb-0" th:each="mensagem : ${#fields.globalErrors()}" th:text="${mensagem}">Erro</p>
        </div>

        <div class="card mb-3">
            <div class="card-body row g-3">
                <div class="col-md-6">
                    <label for="nome" class="form-label">Nome do responsável</label>
                    <input type="text" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"
                           maxlength="120" required>
                    <div class="invalid-feedback" th:errors="*{nome}">Erro</div>
                </div>
                <div class="col-12">
                    <label for="observacoes" class="form-label">Observações <span class="text-body-secondary">(opcional)</span></label>
                    <textarea class="form-control" th:field="*{observacoes}" th:errorclass="is-invalid"
                              rows="3" maxlength="1000"></textarea>
                    <div class="invalid-feedback" th:errors="*{observacoes}">Erro</div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
            <a th:href="@{/responsaveis}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</section>
</body>
</html>
