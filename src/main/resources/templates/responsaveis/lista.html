<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Responsáveis', ~{::conteudo})}">
<body>
<section th:fragment="conteudo">
    <div class="cabecalho-pagina">
        <div>
            <h1 class="titulo-pagina"><span class="icone-titulo"><i class="bi bi-person-badge"></i></span> Responsáveis</h1>
            <p class="subtitulo-pagina">
                Pessoas que acompanham os atendimentos. Não precisam ter acesso ao sistema.
                Um responsável desativado deixa de aparecer em novos atendimentos, mas continua nos antigos.
            </p>
        </div>
        <div class="acoes-pagina">
            <a th:href="@{/responsaveis/novo}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i> Novo responsável
            </a>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nome</th>
                    <th>Observações</th>
                    <th>Situação</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(responsaveis)}">
                    <td colspan="4" class="estado-vazio">
                        <i class="bi bi-person-badge"></i>
                        Nenhum responsável cadastrado.
                    </td>
                </tr>
                <tr th:each="responsavel : ${responsaveis}">
                    <td class="fw-semibold" th:text="${responsavel.nome}">Ana</td>
                    <td class="text-body-secondary" th:text="${responsavel.observacoes} ?: '—'">—</td>
                    <td>
                        <span th:if="${responsavel.ativo}" class="badge text-bg-success">Ativo</span>
                        <span th:unless="${responsavel.ativo}" class="badge text-bg-secondary">Inativo</span>
                    </td>
                    <td class="text-end text-nowrap">
                        <a th:href="@{/responsaveis/{id}/editar(id=${responsavel.id})}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i> Editar
                        </a>
                        <form th:if="${responsavel.ativo}" th:action="@{/responsaveis/{id}/desativar(id=${responsavel.id})}"
                              method="post" class="d-inline"
                              th:attr="data-confirmar='Desativar ' + ${responsavel.nome} + '? Ele não aparecerá em novos atendimentos.'">
                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-slash-circle"></i> Desativar
                            </button>
                        </form>
                        <form th:unless="${responsavel.ativo}" th:action="@{/responsaveis/{id}/ativar(id=${responsavel.id})}"
                              method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-success">
                                <i class="bi bi-check-circle"></i> Ativar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
