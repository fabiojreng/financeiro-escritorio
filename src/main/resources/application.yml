spring:
  application:
    name: financeiro
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:escritorio}?sslmode=${DB_SSLMODE:prefer}
    username: ${DB_USERNAME:financeiro}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}
  web:
    locale: pt_BR
    locale-resolver: fixed

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 60m
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

app:
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    nome: ${APP_ADMIN_NAME:Administrador}
  escritorio:
    # Aparece nos recibos de vale e nos demonstrativos impressos dos funcionários.
    nome: ${APP_ESCRITORIO_NOME:Escritório}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
