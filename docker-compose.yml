services:
  postgres:
    image: postgres:16-alpine
    container_name: financeiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financeiro}
      POSTGRES_USER: ${DB_USERNAME:-financeiro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - financeiro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  financeiro-pgdata:
